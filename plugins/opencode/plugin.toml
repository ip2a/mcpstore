[plugin]
id = "opencode"
label = "OpenCode"
spec_version = 1
plugin_version = "1.0.0"

[config]
format = "json"
servers_key = "mcp"
supported_fields = ["type", "command", "url", "headers", "enabled", "environment"]
command_shape = "array"
env_key = "environment"
reject_disabled = true

[config.type_map]
local = "command"
remote = "url"

[gateway_entry]
url_key = "url"
extra = { type = "remote", enabled = true }

[discover]
config_paths = ["~/.config/opencode/opencode.json", "~/.opencode.json"]
config_dirs = ["~/.config/opencode"]
cli_commands = ["opencode"]
