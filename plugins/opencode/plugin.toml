[plugin]
id = "opencode"
label = "OpenCode"
spec_version = 1

[config]
format = "json"
servers_key = "mcp"
supported_fields = ["type", "command", "url", "headers", "enabled", "environment", "timeout"]
command_shape = "array"
validate_type_field = true
reject_disabled = true

[gateway_entry]
url_key = "url"
extra = { type = "remote", enabled = true }

[discover]
config_paths = ["~/.config/opencode/opencode.json", "~/.opencode.json"]
config_dirs = ["~/.config/opencode"]
cli_commands = ["opencode"]
