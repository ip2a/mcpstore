[plugin]
id = "claude"
label = "Claude Code"
spec_version = 1

[config]
format = "json"
servers_key = "mcpServers"
supported_fields = ["command", "args", "env", "url", "headers"]

[gateway_entry]
url_key = "url"

[discover]
config_paths = ["~/.claude.json"]
config_dirs = ["~/.claude"]
cli_commands = ["claude"]
