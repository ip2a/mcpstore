[plugin]
id = "pi"
label = "Pi"
spec_version = 1
description = "Pi coding agent with native MCP support (0.99+)"

[config]
format = "json"
servers_key = "mcpServers"
supported_fields = ["type", "command", "args", "env", "url", "headers", "enabled"]
reject_disabled = true

[config.type_map]
stdio = "command"
http = "url"
"streamable-http" = "url"

[gateway_entry]
url_key = "url"

[discover]
config_paths = ["~/.pi/agent/mcp.json"]
config_dirs = ["~/.pi/agent", "~/.pi"]
cli_commands = ["pi"]
