[plugin]
id = "pi"
label = "Pi"
spec_version = 1
description = "Pi coding agent with native MCP support (0.99+)"

[config]
format = "json"
servers_key = "mcpServers"
supported_fields = ["command", "args", "env", "url", "headers", "cwd", "oauth", "type", "exposure", "toolExposure", "enabled", "timeout"]

[gateway_entry]
url_key = "url"

[discover]
config_paths = ["~/.pi/agent/mcp.json"]
config_dirs = ["~/.pi/agent", "~/.pi"]
cli_commands = ["pi"]
