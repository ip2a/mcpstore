[build-system]
requires = ["maturin>=1,<2"]
build-backend = "maturin"

[project]
name = "mcpstore"
version = "1.5.18"
description = "A composable, ready-to-use MCP toolkit for agents and rapid integration."
readme = "README.md"
requires-python = ">=3.10"

dependencies = [    "pydantic[email]>=2.11.7",]

authors = [
    {name = "ooooofish", email = "ooooofish@126.com"}
]
license = "MIT"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]

[project.urls]
"Homepage" = "https://github.com/ip2a/mcpstore"
"Bug Tracker" = "https://github.com/ip2a/mcpstore/issues"

# 重型后端 extras（binary wheel 不含；需源码编译安装）:
#   pip install mcpstore[postgres] --no-binary mcpstore
# 编译时自动透传对应 cargo feature
[project.optional-dependencies]
postgres = []
mongodb = []
s3 = []
duckdb = []
sqlite = []
rocksdb = []
opensearch = []
vault = []
firestore = []
dynamodb = []
disk = []
keyring = []



[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["*test*"]

[tool.maturin]
manifest-path = "../rust/bindings/python/Cargo.toml"
python-source = "src"
module-name = "mcpstore._rust"
# 钉死 default：light + redis + memcached + valkey（对齐 openkeyv）
# 重型后端走源码编译: pip install mcpstore --no-binary mcpstore
features = ["light", "redis", "memcached", "valkey"]


[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple"
default = true

[dependency-groups]
dev = [
    "maturin>=1.14.1",
]
