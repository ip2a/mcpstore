name: release-publish-crates

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

# serializes duplicate dispatches against one sdk-v* tag; a second run still
# fails loudly at crates.io (version already exists)
concurrency:
  group: release-publish-crates-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: crates
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Validate release metadata
        shell: bash
        run: python3 scripts/release_preflight.py --domain sdk --require-tag

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable

      - name: Dry-run publish crate
        run: cargo publish --dry-run --allow-dirty --registry crates-io --manifest-path Cargo.toml

      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6

      - name: Publish crate to crates.io
        run: cargo publish --registry crates-io --manifest-path Cargo.toml --token "${{ steps.auth.outputs.token }}"
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
