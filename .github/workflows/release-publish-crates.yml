name: release-publish-crates

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: crates
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Validate release metadata
        shell: bash
        run: python3 scripts/release_preflight.py --require-tag

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Dry-run publish crate
        run: cargo publish --dry-run --allow-dirty --registry crates-io --manifest-path rust/crates/mcpstore/Cargo.toml

      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish crate to crates.io
        run: cargo publish --registry crates-io --manifest-path rust/crates/mcpstore/Cargo.toml --token "${{ steps.auth.outputs.token }}"
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
