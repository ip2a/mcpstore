name: release-publish-crates

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: crates
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Validate release metadata
        shell: bash
        run: python3 scripts/release_preflight.py --require-tag

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Read crate release version
        id: cargo_meta
        shell: bash
        run: |
          version="$(python3 - <<'PY'
          import sys
          sys.path.insert(0, "scripts")
          from release_version import read_canonical_version
          print(read_canonical_version())
          PY
          )"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Dry-run publish crate
        run: cargo publish --dry-run --allow-dirty --registry crates-io --manifest-path rust/crates/mcpstore/Cargo.toml

      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish crate to crates.io
        run: cargo publish --registry crates-io --manifest-path rust/crates/mcpstore/Cargo.toml --token "${{ steps.auth.outputs.token }}"
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

      - name: Wait for crate on crates.io
        shell: bash
        run: |
          version="${{ steps.cargo_meta.outputs.version }}"
          api_url="https://crates.io/api/v1/crates/mcpstore/${version}"
          user_agent="mcpstore-release-pipeline (https://github.com/ip2a/mcpstore)"
          for attempt in $(seq 1 40); do
            response=$(curl -s -A "${user_agent}" --fail "${api_url}" || true)
            if [ -n "${response}" ] && echo "${response}" | grep -q "\"num\":\"${version}\""; then
              echo "[ok] mcpstore ${version} is visible on crates.io"
              exit 0
            fi
            echo "[info] Waiting for mcpstore ${version} to appear on crates.io (attempt ${attempt}/40)"
            sleep 15
          done
          echo "[error] mcpstore ${version} did not appear on crates.io in time"
          exit 1
