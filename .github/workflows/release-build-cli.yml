# Manual release flow:
#   1. Bump version (scripts/sync_version.py) and push to main
#   2. git tag vX.Y.Z && git push origin vX.Y.Z
#   3. This workflow builds all platform binaries and uploads assets to the GitHub Release
#
# Create the GitHub Release before or after pushing the tag; assets are uploaded once the build finishes.
name: release-build-cli

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-cli-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build-${{ matrix.platform_id }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform_id: darwin
            runner: macos-latest
            target: aarch64-apple-darwin,x86_64-apple-darwin
            artifact_binary: mcpstore
          - platform_id: linux-x64-gnu
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            artifact_binary: mcpstore
          - platform_id: linux-arm64-gnu
            runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            artifact_binary: mcpstore
          - platform_id: win32-x64-msvc
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_binary: mcpstore.exe

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Validate release metadata
        shell: bash
        run: python scripts/release_preflight.py --require-tag

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: ${{ matrix.target }}

      - name: Build target artifact
        if: matrix.platform_id != 'darwin'
        shell: bash
        run: ./scripts/build_target.sh "${{ matrix.target }}" "${{ matrix.platform_id }}" "${{ matrix.artifact_binary }}"

      - name: Build macOS artifacts
        if: matrix.platform_id == 'darwin'
        shell: bash
        run: |
          ./scripts/build_target.sh aarch64-apple-darwin darwin-arm64 mcpstore
          ./scripts/build_target.sh x86_64-apple-darwin darwin-x64 mcpstore

      - name: Run smoke test
        if: matrix.platform_id != 'darwin'
        shell: bash
        run: ./scripts/smoke_test.sh "dist/${{ matrix.platform_id }}/${{ matrix.artifact_binary }}"

      - name: Run smoke tests on macOS
        if: matrix.platform_id == 'darwin'
        shell: bash
        run: |
          ./scripts/smoke_test.sh dist/darwin-arm64/mcpstore
          ./scripts/smoke_test.sh dist/darwin-x64/mcpstore

      - name: Generate checksums
        if: matrix.platform_id != 'darwin'
        shell: bash
        run: |
          python -c 'from pathlib import Path; from scripts.prepare_github_release_assets import sha256; p = Path(__import__("sys").argv[1]); (p.parent / "SHA256SUMS").write_text(f"{sha256(p)}  {p.name}\n", encoding="utf-8")' "dist/${{ matrix.platform_id }}/${{ matrix.artifact_binary }}"

      - name: Generate checksums on macOS
        if: matrix.platform_id == 'darwin'
        shell: bash
        run: |
          python -c 'from pathlib import Path; from scripts.prepare_github_release_assets import sha256; p = Path(__import__("sys").argv[1]); (p.parent / "SHA256SUMS").write_text(f"{sha256(p)}  {p.name}\n", encoding="utf-8")' dist/darwin-arm64/mcpstore
          python -c 'from pathlib import Path; from scripts.prepare_github_release_assets import sha256; p = Path(__import__("sys").argv[1]); (p.parent / "SHA256SUMS").write_text(f"{sha256(p)}  {p.name}\n", encoding="utf-8")' dist/darwin-x64/mcpstore

      - name: Upload build artifact
        if: matrix.platform_id != 'darwin'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: mcpstore-${{ matrix.platform_id }}
          path: dist/${{ matrix.platform_id }}/*
          if-no-files-found: error

      - name: Upload macOS arm64 artifact
        if: matrix.platform_id == 'darwin'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: mcpstore-darwin-arm64
          path: dist/darwin-arm64/*
          if-no-files-found: error

      - name: Upload macOS x64 artifact
        if: matrix.platform_id == 'darwin'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: mcpstore-darwin-x64
          path: dist/darwin-x64/*
          if-no-files-found: error

  upload-release-assets:
    name: upload-release-assets
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
      actions: read
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Validate release metadata
        run: python scripts/release_preflight.py --require-tag

      - name: Download build artifacts
        shell: bash
        run: |
          mkdir -p dist
          for platform in darwin-arm64 darwin-x64 linux-x64-gnu linux-arm64-gnu win32-x64-msvc; do
            gh run download "${GITHUB_RUN_ID}" --name "mcpstore-${platform}" --dir "dist/${platform}"
          done

      - name: Prepare GitHub Release assets
        run: python scripts/prepare_github_release_assets.py --dist-root dist --assets-dir release-assets

      - name: Attest GitHub Release assets
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: release-assets/*

      - name: Upload assets to GitHub Release
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          if ! gh release view "${tag}" >/dev/null 2>&1; then
            gh release create "${tag}" --title "${tag}" --generate-notes --verify-tag --draft
          fi
          gh release upload "${tag}" release-assets/* --clobber
