name: release-publish-pypi

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-linux:
    name: build-linux-${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            target: x86_64-unknown-linux-gnu
          - arch: aarch64
            target: aarch64-unknown-linux-gnu

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Validate release metadata
        run: python scripts/release_preflight.py --require-tag

      - name: Build Linux wheel
        uses: PyO3/maturin-action@86b9d133d34bc1b40018696f782949dac11bd380 # v1.49.4
        with:
          command: build
          maturin-version: v1.14.1
          target: ${{ matrix.target }}
          manylinux: "2_28"
          working-directory: python
          # memcached feature vendors OpenSSL; its perl build needs IPC::Cmd and
          # Time::Piece, which the manylinux container's base perl lacks.
          # Guarded: the cross-compile images have no dnf and need no fix.
          before-script-linux: if command -v dnf >/dev/null 2>&1; then dnf install -y perl-IPC-Cmd perl-Time-Piece; fi
          args: --release --locked --compatibility pypi --out dist

      - name: Verify Linux wheel contents and tag
        shell: bash
        run: |
          set -euo pipefail
          wheel="$(find python/dist -maxdepth 1 -name '*.whl' -print -quit)"
          test -n "$wheel"
          echo "$wheel" | grep -F "manylinux_2_28_${{ matrix.arch }}.whl"
          python - "$wheel" <<'PY'
          import sys
          import zipfile

          with zipfile.ZipFile(sys.argv[1]) as archive:
              names = archive.namelist()

          assert "mcpstore/__init__.py" in names
          assert "mcpstore/_rust.abi3.so" in names
          print(f"verified {sys.argv[1]}")
          PY

      - name: Upload Linux wheel
        uses: actions/upload-artifact@v6
        with:
          name: python-dist-linux-${{ matrix.arch }}
          path: python/dist/*.whl
          if-no-files-found: error

  build-native:
    name: build-${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-arm64
            runner: macos-15
            expected_tag: macosx_11_0_arm64
          - platform: windows-amd64
            runner: windows-2025
            expected_tag: win_amd64

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install maturin
        run: python -m pip install "maturin==1.14.1"

      - name: Validate release metadata
        run: python scripts/release_preflight.py --require-tag

      - name: Build wheel
        run: python -m maturin build --release --locked --compatibility pypi --out dist
        working-directory: python

      - name: Verify wheel tag and import
        shell: bash
        run: |
          set -euo pipefail
          wheel="$(find python/dist -maxdepth 1 -name '*.whl' -print -quit)"
          test -n "$wheel"
          echo "$wheel" | grep -F "${{ matrix.expected_tag }}.whl"
          python -m pip install --force-reinstall "$wheel"
          python -c "import mcpstore, mcpstore._rust; print(mcpstore.__version__); print(mcpstore._rust.__file__)"

      - name: Upload wheel
        uses: actions/upload-artifact@v6
        with:
          name: python-dist-${{ matrix.platform }}
          path: python/dist/*.whl
          if-no-files-found: error

  verify-linux:
    name: verify-linux-${{ matrix.arch }}
    runs-on: ubuntu-latest
    needs: build-linux
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            docker_platform: linux/amd64
          - arch: aarch64
            docker_platform: linux/arm64

    steps:
      - name: Set up QEMU
        if: ${{ matrix.arch == 'aarch64' }}
        uses: docker/setup-qemu-action@v3

      - name: Download Linux wheel
        uses: actions/download-artifact@v7
        with:
          name: python-dist-linux-${{ matrix.arch }}
          path: dist

      - name: Verify wheel on Debian Bookworm
        shell: bash
        run: |
          set -euo pipefail
          for python_version in 3.10 3.13; do
            docker run --rm \
              --platform "${{ matrix.docker_platform }}" \
              -v "$PWD/dist:/dist:ro" \
              "python:${python_version}-slim-bookworm" \
              sh -c 'python -m pip install --no-cache-dir /dist/*.whl && python -c "import platform, mcpstore, mcpstore._rust; print(platform.machine()); print(mcpstore.__version__); print(mcpstore._rust.__file__)"'
          done

  publish:
    name: publish-pypi
    runs-on: ubuntu-latest
    needs:
      - build-linux
      - build-native
      - verify-linux
    environment: pypi
    permissions:
      contents: read
      id-token: write
      actions: read

    steps:
      - name: Download wheels
        uses: actions/download-artifact@v7
        with:
          pattern: python-dist-*
          path: dist
          merge-multiple: true

      - name: Verify release files
        shell: bash
        run: |
          set -euo pipefail
          find dist -maxdepth 1 -name '*.whl' -print | sort
          for tag in \
            manylinux_2_28_x86_64 \
            manylinux_2_28_aarch64 \
            macosx_11_0_arm64 \
            win_amd64; do
            find dist -maxdepth 1 -name "*${tag}.whl" -print -quit | grep -q .
          done

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
