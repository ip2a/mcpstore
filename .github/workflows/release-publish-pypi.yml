name: release-publish-pypi

on:
  workflow_dispatch:

permissions:
  contents: read

# serializes duplicate dispatches against one sdk-v* tag; a second run still
# fails loudly at PyPI (version already exists)
concurrency:
  group: release-publish-pypi-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-linux:
    name: build-linux-${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            target: x86_64-unknown-linux-gnu
          - arch: aarch64
            target: aarch64-unknown-linux-gnu

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Validate release metadata
        run: python scripts/release_preflight.py --domain sdk --require-tag

      - name: Build Linux wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: build
          maturin-version: v1.16.0
          target: ${{ matrix.target }}
          manylinux: "2_28"
          working-directory: satellite/python
          # memcached feature vendors OpenSSL; its perl build needs IPC::Cmd and
          # Time::Piece, which the manylinux container's base perl lacks.
          # Guarded: the cross-compile images have no dnf and need no fix.
          before-script-linux: if command -v dnf >/dev/null 2>&1; then dnf install -y perl-IPC-Cmd perl-Time-Piece; fi
          args: --release --locked --compatibility pypi --out dist

      - name: Verify Linux wheel contents and tag
        shell: bash
        run: |
          set -euo pipefail
          wheel="$(find satellite/python/dist -maxdepth 1 -name '*.whl' -print -quit)"
          test -n "$wheel"
          echo "$wheel" | grep -F "manylinux_2_28_${{ matrix.arch }}.whl"
          python - "$wheel" <<'PY'
          import sys
          import zipfile

          with zipfile.ZipFile(sys.argv[1]) as archive:
              names = archive.namelist()

          assert "mcpstore/__init__.py" in names
          assert "mcpstore/_rust.abi3.so" in names
          print(f"verified {sys.argv[1]}")
          PY

      - name: Upload Linux wheel
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-dist-linux-${{ matrix.arch }}
          path: satellite/python/dist/*.whl
          if-no-files-found: error

  build-native:
    name: build-${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-arm64
            runner: macos-15
            expected_tag: macosx_11_0_arm64
          - platform: windows-amd64
            runner: windows-2025
            expected_tag: win_amd64

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable

      - name: Install maturin
        run: python -m pip install "maturin==1.16.0"

      - name: Validate release metadata
        run: python scripts/release_preflight.py --domain sdk --require-tag

      - name: Build wheel
        run: python -m maturin build --release --locked --compatibility pypi --out dist
        working-directory: satellite/python

      - name: Verify wheel tag and import
        shell: bash
        run: |
          set -euo pipefail
          wheel="$(find satellite/python/dist -maxdepth 1 -name '*.whl' -print -quit)"
          test -n "$wheel"
          echo "$wheel" | grep -F "${{ matrix.expected_tag }}.whl"
          python -m pip install --force-reinstall "$wheel"
          python -c "import mcpstore, mcpstore._rust; print(mcpstore.__version__); print(mcpstore._rust.__file__)"

      - name: Upload wheel
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-dist-${{ matrix.platform }}
          path: satellite/python/dist/*.whl
          if-no-files-found: error

  verify-linux:
    name: verify-linux-${{ matrix.arch }}
    runs-on: ubuntu-latest
    needs: build-linux
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            docker_platform: linux/amd64
          - arch: aarch64
            docker_platform: linux/arm64

    steps:
      - name: Set up QEMU
        if: ${{ matrix.arch == 'aarch64' }}
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Download Linux wheel
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-dist-linux-${{ matrix.arch }}
          path: dist

      - name: Verify wheel on Debian Bookworm
        shell: bash
        run: |
          set -euo pipefail
          for python_version in 3.10 3.13; do
            docker run --rm \
              --platform "${{ matrix.docker_platform }}" \
              -v "$PWD/dist:/dist:ro" \
              "python:${python_version}-slim-bookworm" \
              sh -c 'python -m pip install --no-cache-dir /dist/*.whl && python -c "import platform, mcpstore, mcpstore._rust; print(platform.machine()); print(mcpstore.__version__); print(mcpstore._rust.__file__)"'
          done

  publish:
    name: publish-pypi
    runs-on: ubuntu-latest
    needs:
      - build-linux
      - build-native
      - verify-linux
    environment: pypi
    permissions:
      contents: read
      id-token: write
      actions: read

    steps:
      - name: Download wheels
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: python-dist-*
          path: dist
          merge-multiple: true

      - name: Verify release files
        shell: bash
        run: |
          set -euo pipefail
          find dist -maxdepth 1 -name '*.whl' -print | sort
          for tag in \
            manylinux_2_28_x86_64 \
            manylinux_2_28_aarch64 \
            macosx_11_0_arm64 \
            win_amd64; do
            find dist -maxdepth 1 -name "*${tag}.whl" -print -quit | grep -q .
          done

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist
