name: release-finalize

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: release-finalize-${{ github.ref }}
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate release tag
        run: python scripts/release_preflight.py --domain app --require-tag

      - name: Verify all release workflows succeeded for this tag
        shell: bash
        run: |
          for workflow in release-build-cli release-publish-npm release-build-desktop; do
            python3 scripts/wait_release_run.py "$workflow" --minutes 45
          done

      - name: Publish GitHub Release
        shell: bash
        run: |
          set -euo pipefail
          if [ "$(gh release view "${GITHUB_REF_NAME}" --json isDraft --jq .isDraft)" = false ]; then
            echo "Release ${GITHUB_REF_NAME} is already public"
            exit 0
          fi
          gh release edit "${GITHUB_REF_NAME}" --draft=false
