name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Check Rust workspace
        run: cargo check --workspace --manifest-path rust/Cargo.toml

      - name: Check Rust workspace (light feature only)
        run: cargo check -p mcpstore --no-default-features --features light --manifest-path rust/Cargo.toml

      - name: Test Rust workspace
        run: cargo test --workspace --manifest-path rust/Cargo.toml

  python:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install maturin
        run: python -m pip install "maturin==1.14.1"

      - name: Check Python package metadata
        run: python -m pip install -e python

      - name: Import Python package
        run: python -c "import mcpstore; print(mcpstore.__version__)"

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.13.0"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install locked web dependencies
        run: npm ci

      - name: Build web application
        run: npm run build

  release-metadata:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Validate release metadata
        run: python scripts/release_preflight.py

      - name: Validate npm package manifests
        run: |
          for package in npm/packages/*/package.json; do
            node -e "JSON.parse(require('fs').readFileSync(process.argv[1], 'utf8'))" "$package"
          done
