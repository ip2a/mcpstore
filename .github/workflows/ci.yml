name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable

      - name: Check Rust workspace
        run: cargo check --workspace

      - name: Test Rust workspace
        run: cargo test --workspace

      - name: Check CLI satellite workspace
        run: cargo check --locked --manifest-path satellite/cli/Cargo.toml

      - name: Test CLI satellite workspace
        run: cargo test --locked --manifest-path satellite/cli/Cargo.toml

  python:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Install maturin
        run: python -m pip install "maturin==1.16.0"

      - name: Check Python package metadata
        run: python -m pip install -e satellite/python

      - name: Import Python package
        run: python -c "import mcpstore; print(mcpstore.__version__)"

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: satellite/web
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.3"
          cache: npm
          cache-dependency-path: satellite/web/package-lock.json

      - name: Install locked web dependencies
        run: npm ci

      - name: Lint web application
        run: npm run lint

      - name: Build web application
        run: npm run build

  release-metadata:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Validate release metadata
        run: python scripts/release_preflight.py

      - name: Run release domain regression tests
        run: |
          python scripts/test_release_domains.py
          python scripts/test_wait_release_run.py
          python scripts/test_desktop_update_manifest.py

      - name: Validate npm package manifests
        run: |
          for package in satellite/npm/packages/*/package.json; do
            node -e "JSON.parse(require('fs').readFileSync(process.argv[1], 'utf8'))" "$package"
          done
