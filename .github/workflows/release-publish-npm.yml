# Runs automatically for stable tags: dispatched by release-build-cli after the
# CLI build and assets upload finish, with build_run_id pinned to the
# originating run. Manual run (candidates that want npm):
#   gh workflow run release-publish-npm.yml --ref vX.Y.Z-rc.N
# Publishes @ip2a/mcpstore and platform packages through npm trusted publishing
# (OIDC). No NPM_TOKEN secret is used. Every package needs a trusted publisher
# for repo ip2a/mcpstore and workflow release-publish-npm.yml on npmjs.com.

name: release-publish-npm

on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: "release-build-cli run to take artifacts from (set by the automatic chain; empty = discover by tag+SHA)"
        required: false
        type: string
        default: ""

permissions:
  contents: read
  id-token: write
  # gh run list / gh run download below read workflow runs and artifacts
  actions: read

# serializes duplicate dispatches (auto chain + manual) against one tag
concurrency:
  group: release-publish-npm-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # matches the Environment field of each package's trusted publisher on npm
    environment: npm
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}

      - name: Install Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      # Node 24 ships npm >= 11.5, required for trusted publishing (OIDC)
      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.3"
          registry-url: https://registry.npmjs.org/

      - name: Validate release metadata
        run: python scripts/release_preflight.py --domain app --require-tag

      - name: Find release-build run for this tag
        env:
          BUILD_RUN_ID_INPUT: ${{ inputs.build_run_id }}
        run: |
          id="$(python3 scripts/wait_release_run.py release-build-cli --run-id "$BUILD_RUN_ID_INPUT")"
          echo "BUILD_RUN_ID=$id" >> "$GITHUB_ENV"

      - name: Download build artifacts
        run: |
          mkdir -p dist
          # every platform the tag declares (assemble reads the same list);
          # publishing below decides which of them actually go to npm
          for platform in $(python3 -c "import tomllib; print(' '.join(p['id'] for p in tomllib.load(open('satellite/platforms.toml','rb'))['platforms']))"); do
            gh run download "${BUILD_RUN_ID}" --name "mcpstore-${platform}" --dir "dist/${platform}"
          done

      - name: Assemble npm platform packages
        run: python scripts/assemble_npm_packages.py

      - name: Publish npm packages
        run: |
          set -euo pipefail
          # publish_one() safe-resume contract for re-dispatch after partial
          # uploads: absent from registry -> publish; already present with a
          # byte-identical tarball -> verified skip; present with different
          # content -> hard stop. Never silently skip a conflict.
          publish_one() {
            dir="$1"
            name="$(node -p "require('./${dir}/package.json').name")"
            version="$(node -p "require('./${dir}/package.json').version")"
            registry="$(npm view "${name}@${version}" dist.integrity 2>&1)" && present=1 || present=0
            if [ "${present}" = 1 ]; then
              # already on the registry: only a byte-identical rebuild may resume
              tarball="$(npm pack "./${dir}" --pack-destination "${RUNNER_TEMP}" | tail -n1)"
              local_integrity="sha512-$(openssl dgst -sha512 -binary "${RUNNER_TEMP}/$(basename "${tarball}")" | base64 | tr -d '\n')"
              if [ "${local_integrity}" != "${registry}" ]; then
                echo "::error::${name}@${version} already exists on the registry with different content (registry ${registry} != local ${local_integrity}); refusing to skip or overwrite"
                exit 1
              fi
              echo "[skip] ${name}@${version} already published with identical integrity"
              return 0
            fi
            # absence is only proven by 404; anything else (rate limit, network)
            # must not be misread as "unpublished" and turned into a publish
            if ! grep -q "E404" <<<"${registry}"; then
              echo "::error::registry lookup for ${name}@${version} failed without 404; refusing to publish on unknown registry state: ${registry}"
              exit 1
            fi
            (cd "${dir}" && npm publish --access public --provenance)
            echo "[ok] published ${name}@${version}"
          }
          # platform packages first: the main package resolves them through
          # optionalDependencies at install time; the loop is driven by
          # platforms.toml so a new platform cannot be silently skipped
          for dir in $(python3 -c "import tomllib; print(' '.join(p['npm_dir'] for p in tomllib.load(open('satellite/platforms.toml','rb'))['platforms']))"); do
            publish_one "satellite/npm/packages/${dir}"
          done
          publish_one "satellite/npm/packages/mcpstore"

  dispatch-finalize:
    name: dispatch-release-finalize
    runs-on: ubuntu-latest
    needs: publish
    # Stable tags chain into the finalize gate automatically; prerelease
    # versions never reach npm publish (preflight rejects them), so this
    # guard only re-states the stable-only rule for manual dispatches.
    if: ${{ !contains(github.ref_name, '-') }}
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Dispatch finalize
        # -R: this job has no checkout, so gh has no repo context from git
        run: gh workflow run release-finalize.yml --ref "${GITHUB_REF_NAME}" -R "${GITHUB_REPOSITORY}"
