# Manual release flow: after release-build-cli has finished for a tag, run
#   gh workflow run release-publish-npm.yml --ref main -f tag=vX.Y.Z
# The workflow checks out that tag and publishes @ip2a/mcpstore plus the five
# @ip2a/mcpstore-bin-* platform packages with provenance. Dispatching to main
# (instead of the tag ref) means npm publish fixes take effect without moving
# the tag or cutting a new release.
# Requires the repo secret NPM_TOKEN (npm granular access token with publish
# rights for the @ip2a scope) and the "npm" GitHub environment.
name: release-publish-npm

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (e.g. v2.3.0)"
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    env:
      GH_TOKEN: ${{ github.token }}
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag }}

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org/

      # The tag guard in preflight reads GITHUB_REF_*; pass it via shell-level
      # env prefix — the runner does not let step env override its own
      # GITHUB_* context variables, and we dispatch to main, not the tag.
      - name: Validate release metadata
        run: GITHUB_REF_TYPE=tag GITHUB_REF_NAME="${{ inputs.tag }}" python scripts/release_preflight.py --require-tag

      - name: Find release-build run for this tag
        run: |
          run_id="$(gh run list --workflow=release-build-cli --branch="${{ inputs.tag }}" --status=success --limit=1 --json databaseId --jq '.[0].databaseId')"
          if [ -z "${run_id}" ]; then
            echo "::error::No successful release-build-cli run found for ${{ inputs.tag }}"
            exit 1
          fi
          echo "BUILD_RUN_ID=${run_id}" >> "${GITHUB_ENV}"

      - name: Download build artifacts
        run: |
          mkdir -p dist
          for platform in darwin-arm64 darwin-x64 linux-x64-gnu linux-arm64-gnu win32-x64-msvc; do
            gh run download "${BUILD_RUN_ID}" --name "mcpstore-${platform}" --dir "dist/${platform}"
          done

      - name: Assemble npm platform packages
        run: python scripts/assemble_npm_packages.py

      - name: Publish @ip2a/mcpstore-bin-darwin-arm64
        run: npm publish --access public --provenance
        working-directory: npm/packages/mcpstore-bin-darwin-arm64

      - name: Publish @ip2a/mcpstore-bin-darwin-x64
        run: npm publish --access public --provenance
        working-directory: npm/packages/mcpstore-bin-darwin-x64

      - name: Publish @ip2a/mcpstore-bin-linux-x64-gnu
        run: npm publish --access public --provenance
        working-directory: npm/packages/mcpstore-bin-linux-x64-gnu

      - name: Publish @ip2a/mcpstore-bin-linux-arm64-gnu
        run: npm publish --access public --provenance
        working-directory: npm/packages/mcpstore-bin-linux-arm64-gnu

      - name: Publish @ip2a/mcpstore-bin-win32-x64-msvc
        run: npm publish --access public --provenance
        working-directory: npm/packages/mcpstore-bin-win32-x64-msvc

      - name: Publish @ip2a/mcpstore
        run: npm publish --access public --provenance
        working-directory: npm/packages/mcpstore
