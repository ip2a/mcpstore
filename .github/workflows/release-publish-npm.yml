# Run only from immutable release tag after release-build-cli succeeds:
#   gh workflow run release-publish-npm.yml --ref vX.Y.Z
# Publishes @ip2a/mcpstore and platform packages through npm trusted publishing
# (OIDC). No NPM_TOKEN secret is used. Every package needs a trusted publisher
# for repo ip2a/mcpstore and workflow release-publish-npm.yml on npmjs.com.

name: release-publish-npm

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    # matches the Environment field of each package's trusted publisher on npm
    environment: npm
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      # Node 24 ships npm >= 11.5, required for trusted publishing (OIDC)
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.13.0"
          registry-url: https://registry.npmjs.org/

      - name: Validate release metadata
        run: python scripts/release_preflight.py --require-tag

      - name: Find release-build run for this tag
        run: |
          run_id="$(gh run list --workflow=release-build-cli --branch="${{ github.ref_name }}" --status=success --limit=1 --json databaseId --jq '.[0].databaseId')"
          if [ -z "${run_id}" ]; then
            echo "::error::No successful release-build-cli run found for ${{ github.ref_name }}"
            exit 1
          fi
          echo "BUILD_RUN_ID=${run_id}" >> "${GITHUB_ENV}"

      - name: Download build artifacts
        run: |
          mkdir -p dist
          # every platform the tag declares (assemble reads the same list);
          # publishing below decides which of them actually go to npm
          for platform in $(python3 -c "import tomllib; print(' '.join(p['id'] for p in tomllib.load(open('platforms.toml','rb'))['platforms']))"); do
            gh run download "${BUILD_RUN_ID}" --name "mcpstore-${platform}" --dir "dist/${platform}"
          done

      - name: Assemble npm platform packages
        run: python scripts/assemble_npm_packages.py

      - name: Publish @ip2a/mcpstore-bin-darwin-arm64
        run: npm publish --access public --provenance
        working-directory: npm/packages/mcpstore-bin-darwin-arm64

      - name: Publish @ip2a/mcpstore-bin-linux-x64-gnu
        run: npm publish --access public --provenance
        working-directory: npm/packages/mcpstore-bin-linux-x64-gnu

      - name: Publish @ip2a/mcpstore-bin-linux-arm64-gnu
        run: npm publish --access public --provenance
        working-directory: npm/packages/mcpstore-bin-linux-arm64-gnu

      - name: Publish @ip2a/mcpstore-bin-win32-x64-msvc
        run: npm publish --access public --provenance
        working-directory: npm/packages/mcpstore-bin-win32-x64-msvc

      - name: Publish @ip2a/mcpstore
        run: npm publish --access public --provenance
        working-directory: npm/packages/mcpstore
