# App-domain builds share a draft release with release-build-cli. Only
# release-finalize publishes it; candidates never upload latest.json.
name: release-build-desktop

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build-${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: darwin-aarch64
            runner: macos-latest
            target: aarch64-apple-darwin
          - platform: windows-x86_64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
          - platform: linux-x86_64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - platform: linux-aarch64
            runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
    defaults:
      run:
        shell: bash
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      TARGET: ${{ matrix.target }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Validate release metadata
        run: python scripts/release_preflight.py --domain app --require-tag --allow-prerelease-tag

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev patchelf xdg-utils

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.3"

      - name: Build web application
        working-directory: satellite/web
        run: |
          npm ci
          npm run build

      - name: Build daemon sidecar
        run: |
          ext=''
          if [[ $RUNNER_OS == Windows ]]; then ext=.exe; fi
          cargo build --locked --release --target "$TARGET" --manifest-path satellite/cli/Cargo.toml --bin mcpstore
          mkdir -p satellite/desktop/tauri/binaries
          cp "target/$TARGET/release/mcpstore$ext" "satellite/desktop/tauri/binaries/mcpstore-$TARGET$ext"

      - name: Install Tauri CLI
        run: npm i -g @tauri-apps/cli@2.12.6

      - name: Build signed native bundles
        working-directory: satellite/desktop/tauri
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: tauri build --target "$TARGET"

      - name: Collect installers and updater signatures
        run: |
          mkdir dist
          cd "target/$TARGET/release/bundle"
          case "$RUNNER_OS" in
            macOS) files=(dmg/*.dmg macos/*.app.tar.gz macos/*.app.tar.gz.sig) ;;
            Windows) files=(msi/*.msi msi/*.msi.sig nsis/*.exe nsis/*.exe.sig) ;;
            Linux) files=(deb/*.deb deb/*.deb.sig appimage/*.AppImage appimage/*.AppImage.sig) ;;
          esac
          cp "${files[@]}" "$GITHUB_WORKSPACE/dist/"

      - name: Upload build artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mcpstore-desktop-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error

  upload-updater-assets:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: mcpstore-desktop-*
          path: dist

      - name: Validate assets and generate latest.json
        run: python3 scripts/desktop_update_manifest.py dist "$GITHUB_REF_NAME" "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"

      - name: Upload assets to GitHub Release
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          case "${tag}" in *-*) prerelease=(--prerelease) ;; *) prerelease=() ;; esac
          if [ "$(gh release view "${tag}" --json isDraft --jq .isDraft 2>/dev/null)" = "false" ]; then
            echo "::error::Release ${tag} is already public; refusing to mutate its assets"
            exit 1
          fi
          if ! gh release view "${tag}" >/dev/null 2>&1; then
            # release-build-cli may win the draft creation race.
            gh release create "${tag}" --title "${tag}" --generate-notes --verify-tag --draft "${prerelease[@]}" \
              || gh release view "${tag}" >/dev/null
          fi
          assets=(dist/mcpstore-desktop-*/*)
          if [ ${#prerelease[@]} -eq 0 ]; then assets+=(dist/latest.json); fi
          gh release upload "${tag}" "${assets[@]}" --clobber
