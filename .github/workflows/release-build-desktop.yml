# Desktop (Tauri) release flow. Runs on the same tags as release-build-cli and
# uploads the macOS .dmg plus updater artifacts (.app.tar.gz + .sig) and
# latest.json to the GitHub Release so tauri-plugin-updater can serve updates from:
#   https://github.com/ip2a/mcpstore/releases/latest/download/latest.json
#
# The GitHub Release is created (or reused) as a DRAFT: this workflow and
# release-build-cli race on the same tag, and only release-finalize may
# publish a draft. latest.json is uploaded for stable tags only, so
# candidate builds never feed the Tauri auto-updater channel.
#
# Required repository secrets:
#   TAURI_SIGNING_PRIVATE_KEY           contents of ~/.tauri/mcpstore.key
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  the key's password
name: release-build-desktop

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-macos:
    name: build-macos-${{ matrix.target }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            platform: darwin-aarch64

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Validate release metadata
        run: python scripts/release_preflight.py --domain app --require-tag --allow-prerelease-tag

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          targets: ${{ matrix.target }}

      - name: Build web application
        working-directory: satellite/web
        run: |
          npm ci
          npm run build

      - name: Build daemon sidecar
        run: |
          cargo build --release --target ${{ matrix.target }} --manifest-path satellite/cli/Cargo.toml --bin mcpstore
          mkdir -p satellite/desktop/tauri/binaries
          cp satellite/cli/target/${{ matrix.target }}/release/mcpstore satellite/desktop/tauri/binaries/mcpstore-${{ matrix.target }}
          chmod +x satellite/desktop/tauri/binaries/mcpstore-${{ matrix.target }}

      - name: Build Tauri app
        working-directory: satellite/desktop/tauri
        env:
          # signing material is only exposed to the build step
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          # exact pin: updater signature format must stay reproducible
          npm i -g @tauri-apps/cli@2.12.6
          # app bundle is required: createUpdaterArtifacts emits .app.tar.gz/.sig
          # only when the app target is built; --bundles dmg alone would skip it
          tauri build --target ${{ matrix.target }} --bundles app,dmg

      - name: Collect updater artifacts
        shell: bash
        run: |
          mkdir -p dist/${{ matrix.platform }}
          target="satellite/desktop/tauri/target/${{ matrix.target }}/release/bundle"
          cp "${target}/macos"/*.app.tar.gz "${target}/macos"/*.app.tar.gz.sig dist/${{ matrix.platform }}/
          cp "${target}/dmg"/*.dmg dist/${{ matrix.platform }}/
          ls -la dist/${{ matrix.platform }}

      - name: Upload build artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mcpstore-desktop-${{ matrix.platform }}
          path: dist/${{ matrix.platform }}/*
          if-no-files-found: error

  upload-updater-assets:
    name: upload-updater-assets
    runs-on: ubuntu-latest
    needs: build-macos
    # contents: write to attach assets to the (draft) GitHub Release;
    # actions: read for gh run download of this run's build artifacts
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Validate release metadata
        run: python scripts/release_preflight.py --domain app --require-tag --allow-prerelease-tag

      - name: Download build artifacts
        shell: bash
        run: |
          mkdir -p dist
          gh run download "${GITHUB_RUN_ID}" --name "mcpstore-desktop-darwin-aarch64" --dir dist/darwin-aarch64

      - name: Generate latest.json
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          python - "$version" <<'EOF'
          import json, sys
          from pathlib import Path

          version = sys.argv[1]
          tag = f"v{version}"
          base = f"https://github.com/ip2a/mcpstore/releases/download/{tag}"
          platforms = {}
          for identifier in ("darwin-aarch64",):
              directory = Path("dist") / identifier
              archive = next(directory.glob("*.app.tar.gz"))
              platforms[identifier] = {
                  "signature": (directory / f"{archive.name}.sig").read_text(encoding="utf-8").strip(),
                  "url": f"{base}/{archive.name}",
              }
          Path("dist/latest.json").write_text(
              json.dumps({"version": version, "platforms": platforms}, indent=2),
              encoding="utf-8",
          )
          EOF
          cat dist/latest.json

      - name: Upload assets to GitHub Release
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          # tags with a pre-release suffix (vX.Y.Z-rc.N) must not ship as latest
          case "${tag}" in *-*) prerelease=(--prerelease) ;; *) prerelease=() ;; esac
          # release assets are immutable once the release is public; only
          # release-finalize may publish a draft, so a public release here
          # means the gate already ran (or was bypassed) — refuse to mutate
          if [ "$(gh release view "${tag}" --json isDraft --jq .isDraft 2>/dev/null)" = "false" ]; then
            echo "::error::Release ${tag} is already public; refusing to mutate its assets"
            exit 1
          fi
          if ! gh release view "${tag}" >/dev/null 2>&1; then
            # release-build-cli may create the same draft release concurrently;
            # losing that create race is fine as long as the release exists
            gh release create "${tag}" --title "${tag}" --generate-notes --verify-tag --draft "${prerelease[@]}" \
              || gh release view "${tag}" >/dev/null
          fi
          assets=(dist/darwin-aarch64/*.app.tar.gz dist/darwin-aarch64/*.app.tar.gz.sig \
            dist/darwin-aarch64/*.dmg)
          # pre-releases must never feed the Tauri auto-updater channel
          if [ ${#prerelease[@]} -eq 0 ]; then assets+=(dist/latest.json); fi
          gh release upload "${tag}" "${assets[@]}" --clobber
