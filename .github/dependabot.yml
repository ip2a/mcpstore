version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    target-branch: main

  - package-ecosystem: cargo
    directories:
      - "/"
      - "/satellite/cli"
      - "/satellite/desktop/tauri"
    schedule:
      interval: weekly
    target-branch: main

  - package-ecosystem: pip
    directory: "/satellite/python"
    schedule:
      interval: weekly
    target-branch: main

  - package-ecosystem: npm
    directory: "/satellite/web"
    schedule:
      interval: weekly
    target-branch: main
