[package]
name = "mcpstore-tauri"
version = "2.3.1"
edition = "2021"
publish = false

[lib]
name = "mcpstore_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "mcpstore-tauri"
path = "src/main.rs"

[dependencies]
mcpstore-cli = { path = "../../rust/apps/mcpstore" }
anyhow = "1.0"
dirs = "6.0"
reqwest = { version = "0.12", features = ["json"] }
tauri = { version = "2", features = [] }
# Required by the tauri::generate_context! macro expansion, not by hand-written code.
serde_json = "1"
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
tauri-plugin-window-state = "2"
tokio = { version = "1", features = ["rt", "time"] }

# Native content-aspect lock while dragging (avoids Resized↔set_size flicker).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
  "std",
  "NSResponder",
  "NSWindow",
] }
objc2-foundation = { version = "0.3.2", default-features = false, features = [
  "std",
  "NSGeometry",
] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
