[package]
name = "mcpstore-desktop"
version = "0.1.0"
edition = "2021"
rust-version = "1.99"
description = "GPUI desktop control panel for mcpstore"

[dependencies]
gpui-kit = "0.7"
anyhow = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ureq = { version = "3", default-features = false, features = ["json"] }
urlencoding = "2"
