site_name: McpStore
site_description: MCP 服务编排与工具接入文档
site_author: whillhill
site_url: https://mcpstore.wiki

# Repository
repo_name: whillhill/mcpstore
repo_url: https://github.com/whillhill/mcpstore
edit_uri: edit/main/docs/docs/

# Copyright
copyright: Copyright &copy; 2025 whillhill

# Configuration
theme:
  name: material
  language: zh

  # Logo and favicon
  favicon: assets/favicon.ico

  # 字体配置
  font:
    text: Noto Sans SC
    code: JetBrains Mono

  # Color palette
  palette:
    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: 切换到深色模式

    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: 切换到浅色模式

  # Features - 优化的左右布局配置
  features:
    - announce.dismiss
    - content.action.edit
    - content.action.view
    - content.code.annotate
    - content.code.copy
    - content.tabs.link
    - content.tooltips
    - header.autohide
    - navigation.footer
    - navigation.indexes
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.instant.progress
    - navigation.prune
    - navigation.sections
    # 不使用顶部标签页，保持左侧导航
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.share
    - search.suggest
    # 关键配置：右侧显示页面内目录
    - toc.follow
    # 不集成到左侧，保持独立的右侧目录
    # - toc.integrate

# Plugins
plugins:
  - search:
      separator: '[\s\u200b\-_,:!=\[\]()"`/]+|\.(?!\d)|&[lg]t;|(?!\b)(?=[A-Z][a-z])'
      lang:
        - zh
        - en
  - minify:
      minify_html: true
      minify_css: true
      minify_js: true
      htmlmin_opts:
        remove_comments: true
        remove_empty_space: true
      cache_safe: true

# Customization
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/whillhill/mcpstore
      name: GitHub 仓库
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/mcpstore/
      name: PyPI 包
    - icon: fontawesome/solid/book
      link: https://mcpstore.wiki
      name: 在线文档

extra_css:
  - assets/extra.css

# Extensions
markdown_extensions:
  - toc:
      permalink: true
      toc_depth: 3
  - tables
  - fenced_code
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
      emoji_index: !!python/name:material.extensions.emoji.twemoji
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.magiclink:
      normalize_issue_symbols: true
      repo_url_shorthand: true
      user: mcpstore
      repo: mcpstore
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets:
      auto_append:
        - includes/mkdocs.md
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
      combine_header_slug: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

# Navigation
nav:
  - 首页: index.md
  - 快速开始: start/quickstart.md
  - 认识 MCPStore:
      - MCPStore 是什么: concepts/overview.md
      - 使用关系: concepts/connections.md
  - 管理 MCP 服务:
      - 管理概览: management/overview.md
      - 服务管理任务: management/tasks.md
  - 本地使用:
      - CLI 与 TUI: clients/local.md
      - 桌面端与 Web: clients/desktop.md
  - 集成到代码:
      - 集成概览: integration/overview.md
      - Rust: integration/rust.md
      - Python: integration/python.md
  - 远程使用:
      - 连接远程 MCPStore: remote/overview.md
  - 参考:
      - 参考概览: reference/overview.md
      - CLI: reference/cli.md
      - 配置: reference/config.md
  - 故障排查: troubleshooting/overview.md
