[package]
name = "mcpstore"
version = "1.5.18"
edition = "2021"
rust-version = "1.78"
authors = ["ooooofish <ooooofish@126.com>"]
license = "MIT"
repository = "https://github.com/ip2a/mcpstore"
description = "MCPStore - unified MCP service management library"
keywords = ["mcp", "ai", "tools", "registry", "cache"]
categories = ["api-bindings", "development-tools"]

[dependencies]
tokio = { version = "1.40", features = ["rt-multi-thread", "sync", "macros", "time", "process", "io-util", "signal", "net"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml_ng = { workspace = true }
toml = "0.8"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-trait = "0.1"
uuid = { version = "1.10", features = ["v4", "v5", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# MCP protocol
rmcp = { workspace = true }

# Cache backends
openkeyv = { path = "/Volumes/data0/data4work/2026_4/openkeyv/rust/crates/openkeyv", default-features = false, features = ["json"] }
# HTTP / web (only needed for the optional MCP server runner)
axum = { version = "0.7", optional = true }
http = "1"
iri-string = "0.7.12"
reqwest = { version = "0.13", default-features = false, features = ["form", "json", "multipart", "rustls"] }
url = "2.5"
futures = "0.3"
sse-stream = "0.2.4"
base64 = "0.22"
regex = "1.11"
email_address = { version = "0.2.9", default-features = false }
blake3 = "1"
keyring = { version = "=3.6.3", default-features = false, features = ["apple-native", "windows-native", "linux-native-sync-persistent", "crypto-rust", "vendored"] }
zeroize = { version = "1", features = ["derive"] }
jsonwebtoken = { version = "10.4", features = ["rust_crypto"] }

[features]
default = ["mcp-server", "backend-redis"]
mcp-server = ["dep:axum", "rmcp/transport-streamable-http-server"]

# Backend passthrough — enable the openkeyv feature for each store type.
backend-memory  = []                             # in-memory (zero-cost)
backend-redis   = ["openkeyv/redis"]
backend-valkey  = ["openkeyv/valkey"]
backend-disk    = ["openkeyv/disk"]
backend-sqlite  = ["openkeyv/sqlite"]
backend-postgres = ["openkeyv/postgres"]
backend-mongodb = ["openkeyv/mongodb"]
backend-memcached = ["openkeyv/memcached"]
backend-rocksdb = ["openkeyv/rocksdb"]
backend-duckdb  = ["openkeyv/duckdb"]
backend-opensearch = ["openkeyv/opensearch"]
backend-vault   = ["openkeyv/vault"]
backend-keyring = ["openkeyv/keyring"]
backend-firestore = ["openkeyv/firestore"]
backend-s3      = ["openkeyv/s3"]
backend-dynamodb = ["openkeyv/dynamodb"]

[dev-dependencies]
tokio-test = "0.4"
